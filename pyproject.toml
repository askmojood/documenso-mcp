[project]
name = "documenso-mcp"
version = "0.1.0"
description = "Mojood Connect demo: an MCP server for Documenso (e-signing), with confirm-before-change writes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "mcp>=2.3",
  "httpx>=0.28",
  "uvicorn>=0.54",
]

[project.scripts]
documenso-mcp = "documenso_mcp.server:main"
documenso-seed = "documenso_mcp.seed:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documenso_mcp"]
